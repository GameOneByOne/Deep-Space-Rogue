<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Space Rogue - Web UI</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <div class="app">
    <header class="topbar">
      <h1>Deep Space Rogue</h1>
      <p class="subtitle">Web Client (FastAPI)</p>
      <div class="subtitle" id="status-text"></div>
    </header>

    <main class="grid">
      <section class="panel panel-events">
        <div class="panel-title">事件面板</div>
        <div id="event-list" class="list event-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-title">资源面板</div>
        <div id="resource-list" class="list resource-list"></div>
      </section>

      <section class="panel">
        <div class="panel-title">操作面板</div>
        <div id="building-list" class="list button-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-title">人力面板</div>
        <div id="profession-list" class="list profession-list"></div>
      </section>

      <section class="panel">
        <div class="panel-title">研究面板</div>
        <div id="research-list" class="list button-grid"></div>
      </section>
    </main>
  </div>

  <div id="tooltip" class="tooltip hidden"></div>
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <script src="./style.js"></script>
</body>
</html>
