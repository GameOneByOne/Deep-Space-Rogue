<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Space Rogue - Web UI</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <div class="app">
    <header class="topbar">
      <h1>远航</h1>
      <div class="top-meta">
        <span id="version-badge" class="version-badge">版本号 v0.1</span>
        <span id="calendar-text" class="calendar-pill">🗓️ 第 0 年 · 第 0 天</span>
      </div>
      <div id="status-text" class="status-hidden"></div>
      <div class="top-actions">
        <button id="theme-toggle-btn" class="secondary-btn" type="button">切换主题</button>
        <button id="reset-save-btn" class="secondary-btn" type="button">重置存档</button>
      </div>
    </header>

    <main class="grid">
      <section class="panel panel-resources">
        <div class="panel-title">资源面板</div>
        <div id="resource-list" class="list resource-list"></div>
      </section>

      <section class="panel panel-buildings">
        <div class="panel-head">
          <div class="panel-title">建筑面板</div>
          <label class="panel-filter">
            <input id="buildable-only-toggle" type="checkbox" />
            <span>可建造</span>
          </label>
        </div>
        <div id="building-list" class="list button-grid"></div>
      </section>

      <section class="panel panel-professions">
        <div class="panel-title">人力面板</div>
        <div id="profession-list" class="list profession-list"></div>
      </section>

      <section class="panel panel-researches">
        <div class="panel-head">
          <div class="panel-title">研究面板</div>
          <label class="panel-filter">
            <input id="hide-finished-research-toggle" type="checkbox" />
            <span>隐藏已完成</span>
          </label>
        </div>
        <div id="research-list" class="list button-grid"></div>
      </section>

      <section class="panel panel-events">
        <div class="panel-title">事件面板</div>
        <div id="event-list" class="list event-grid"></div>
      </section>

      <section class="panel panel-logs">
        <div class="panel-title">日志面板</div>
        <div id="log-list" class="list log-list"></div>
      </section>
    </main>
  </div>

  <div id="tooltip" class="tooltip hidden"></div>
  <script src="./index.js"></script>
</body>
</html>
