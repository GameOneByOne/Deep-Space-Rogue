<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>远航 - Deep Space Rogue</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    .hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
      padding: 24px;
    }
    .hero-inner {
      display: grid;
      place-items: center;
      gap: 18px;
    }
    .title-pixel {
      font-family: "Press Start 2P", "Pixel Operator", "MS Gothic", "SimSun", monospace;
      font-size: 26px;
      letter-spacing: 0.18em;
      color: #bfe9ff;
      text-shadow: 0 0 8px rgba(122, 213, 255, 0.45), 0 0 20px rgba(97, 213, 255, 0.25);
      margin: 0;
    }
    .ship {
      width: min(520px, 86vw);
      height: auto;
      filter: drop-shadow(0 0 12px rgba(97, 213, 255, 0.65));
      animation: ship-float 5s ease-in-out infinite;
      mix-blend-mode: screen;
    }
    .ship path, .ship line, .ship polyline, .ship polygon, .ship circle {
      stroke: #61d5ff;
      stroke-width: 2.2;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .ship .glow {
      stroke-width: 6;
      opacity: 0.25;
      animation: glow-pulse 3.5s ease-in-out infinite;
    }
    .ship .thruster {
      stroke-width: 2.8;
      opacity: 0.6;
      animation: thruster-pulse 1.8s ease-in-out infinite;
    }
    .ship .portlight {
      fill: none;
      stroke-width: 2.2;
      opacity: 0.4;
      animation: portlight-pulse 2.6s ease-in-out infinite;
    }
    .warp-text {
      font-family: "Consolas", "Menlo", "Courier New", monospace;
      font-size: 14px;
      letter-spacing: 0.12em;
      color: #bfe9ff;
      text-shadow: 0 0 8px rgba(122, 213, 255, 0.35);
    }
    .warp-text .dots span {
      display: inline-block;
      width: 0.6em;
      text-align: center;
      animation: dot-blink 1.2s infinite;
      opacity: 0.2;
    }
    .warp-text .dots span:nth-child(2) { animation-delay: 0.2s; }
    .warp-text .dots span:nth-child(3) { animation-delay: 0.4s; }
    .scanline {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.04),
        rgba(255, 255, 255, 0.04) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0.08;
      pointer-events: none;
    }
    @keyframes ship-float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0); }
    }
    @keyframes glow-pulse {
      0% { opacity: 0.18; }
      50% { opacity: 0.5; }
      100% { opacity: 0.18; }
    }
    @keyframes thruster-pulse {
      0% { opacity: 0.35; }
      50% { opacity: 0.85; }
      100% { opacity: 0.35; }
    }
    @keyframes portlight-pulse {
      0% { opacity: 0.25; }
      50% { opacity: 0.65; }
      100% { opacity: 0.25; }
    }
    @keyframes dot-blink {
      0% { opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="scanline"></div>
  <div class="hero">
    <div class="hero-inner">
      <h1 class="title-pixel">远航</h1>
      <svg class="ship" viewBox="0 0 620 360" aria-hidden="true">

          <path d="M120 205 C210 170 340 168 470 198" />

</body>
