<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>远航 - Deep Space Rogue</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    .hero {
      height: 100vh;
      display: block;
      position: relative;
      z-index: 1;
      padding: 0;
    }
    .hero-inner {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .title-pixel {
      font-family: "Press Start 2P", "Pixel Operator", "MS Gothic", "SimSun", monospace;
      font-size: 39px;
      letter-spacing: 0.18em;
      color: #bfe9ff;
      text-shadow: 0 0 8px rgba(122, 213, 255, 0.45), 0 0 20px rgba(97, 213, 255, 0.25);
      margin: 0;
      animation: text-breathe 4.2s ease-in-out infinite;
      position: absolute;
      top: 8vh;
      left: 50%;
      transform: translateX(-50%);
    }
    .ship {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      filter: drop-shadow(0 0 12px rgba(97, 213, 255, 0.65));
      animation: ship-float 5s ease-in-out infinite;
      mix-blend-mode: screen;
    }
    .ship path, .ship line, .ship polyline, .ship polygon, .ship circle {
      stroke: #61d5ff;
      stroke-width: 2.8;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .ship .glow {
      stroke-width: 8;
      opacity: 0.25;
      animation: glow-pulse 3.5s ease-in-out infinite;
    }
    .ship .thruster {
      stroke-width: 3.4;
      opacity: 0.6;
      animation: thruster-pulse 1.8s ease-in-out infinite;
    }
    .ship .portlight {
      fill: none;
      stroke-width: 2.6;
      opacity: 0.4;
      animation: portlight-pulse 2.6s ease-in-out infinite;
    }
    .warp-text {
      font-family: "Consolas", "Menlo", "Courier New", monospace;
      font-size: 21px;
      letter-spacing: 0.12em;
      color: #bfe9ff;
      text-shadow: 0 0 8px rgba(122, 213, 255, 0.35);
      animation: text-breathe 4.2s ease-in-out infinite;
      position: absolute;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .warp-text .dots span {
      display: inline-block;
      width: 0.6em;
      text-align: center;
      animation: dot-blink 1.2s infinite;
      opacity: 0.2;
    }
    .warp-text .dots span:nth-child(2) { animation-delay: 0.2s; }
    .warp-text .dots span:nth-child(3) { animation-delay: 0.4s; }
    .scanline {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.04),
        rgba(255, 255, 255, 0.04) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0.08;
      pointer-events: none;
    }
    .horizon {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 28vh;
      width: 100%;
      height: 2px;
      display: block;
      pointer-events: none;
      z-index: 0;
    }
    .horizon line {
      stroke: #61d5ff;
      stroke-width: 2.8;
      opacity: 0.65;
      vector-effect: non-scaling-stroke;
    }
    @keyframes ship-float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0); }
    }
    @keyframes glow-pulse {
      0% { opacity: 0.02; }
      50% { opacity: 1; }
      100% { opacity: 0.02; }
    }
    @keyframes thruster-pulse {
      0% { opacity: 0.35; }
      50% { opacity: 0.85; }
      100% { opacity: 0.35; }
    }
    @keyframes portlight-pulse {
      0% { opacity: 0.2; }
      50% { opacity: 0.85; }
      100% { opacity: 0.2; }
    }
    @keyframes dot-blink {
      0% { opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { opacity: 0.2; }
    }
    @keyframes text-breathe {
      0% { opacity: 0.75; text-shadow: 0 0 6px rgba(122, 213, 255, 0.25); }
      50% { opacity: 1; text-shadow: 0 0 16px rgba(122, 213, 255, 0.6); }
      100% { opacity: 0.75; text-shadow: 0 0 6px rgba(122, 213, 255, 0.25); }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="scanline"></div>
  <svg class="horizon" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="1" x2="100" y2="1" />
  </svg>
  <div class="hero">
    <div class="hero-inner">
      <h1 class="title-pixel">远航</h1>
      <svg class="ship" viewBox="0 0 420 260" aria-hidden="true">
        <g class="ship-body">
          <g class="glow">
            <path d="M210 30 L245 90 C255 120 255 160 240 195 L210 238 L180 195 C165 160 165 120 175 90 Z" />
            <path d="M180 175 A40 40 0 0 0 145 222 A30 30 0 0 1 198 198 Z" />
            <path d="M240 175 A40 40 0 0 1 275 222 A30 30 0 0 0 222 198 Z" />
            <circle cx="210" cy="115" r="16" />
            <line x1="210" y1="238" x2="210" y2="250" />
            <line x1="205" y1="250" x2="215" y2="250" />
          </g>
          <path d="M210 30 L245 90 C255 120 255 160 240 195 L210 238 L180 195 C165 160 165 120 175 90 Z" />
          <path d="M180 175 A40 40 0 0 0 145 222 A30 30 0 0 1 198 198 Z" />
          <path d="M240 175 A40 40 0 0 1 275 222 A30 30 0 0 0 222 198 Z" />
          <circle class="portlight" cx="210" cy="115" r="16" />
          <line x1="210" y1="238" x2="210" y2="250" />
          <line x1="205" y1="250" x2="215" y2="250" />
        </g>
      </svg>
      <div class="warp-text">曲率引擎初始化<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
  </div>
  <script>
    const shipSvg = document.querySelector(".ship");
    const shipBody = document.querySelector(".ship-body");
    const shipWidth = 420;
    const shipHeight = 260;
    const shipScale = 1.2;

    function sizeShipView() {
      const viewW = window.innerWidth;
      const viewH = window.innerHeight;
      shipSvg.setAttribute("viewBox", `0 0 ${viewW} ${viewH}`);
      const offsetX = Math.max(0, (viewW - shipWidth * shipScale) / 2);
      const offsetY = Math.max(0, (viewH - shipHeight * shipScale) / 2);
      shipBody.setAttribute(
        "transform",
        `translate(${offsetX} ${offsetY}) scale(${shipScale})`
      );
    }

    window.addEventListener("resize", sizeShipView);
    sizeShipView();
  </script>
</body>
</html>
