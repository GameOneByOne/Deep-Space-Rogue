name: Keep Railway Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway API
        run: |
          curl -s "https://web-production-92a08.up.railway.app/state?clientId=keepalive" > /dev/null
          echo "Pinged at $(date)"
